name: Restore CMOTD local fonts

on:
  push:
    paths:
      - ".github/workflows/restore-cmotd-fonts.yml"

permissions:
  contents: write

jobs:
  restore-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download CMOTD font assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/font/Inter assets/font/Newsreader assets/font/MaterialSymbols

          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf'             -o 'assets/font/Inter/Inter-VariableFont_opsz,wght.ttf'
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter-Italic%5Bopsz%2Cwght%5D.ttf'             -o 'assets/font/Inter/Inter-Italic-VariableFont_opsz,wght.ttf'
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/OFL.txt'             -o 'assets/font/Inter/OFL.txt'

          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader%5Bopsz%2Cwght%5D.ttf'             -o 'assets/font/Newsreader/Newsreader-VariableFont_opsz,wght.ttf'
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader-Italic%5Bopsz%2Cwght%5D.ttf'             -o 'assets/font/Newsreader/Newsreader-Italic-VariableFont_opsz,wght.ttf'
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/OFL.txt'             -o 'assets/font/Newsreader/OFL.txt'

          curl -fsSL 'https://fonts.gstatic.com/s/materialsymbolsoutlined/v372/kJEhBvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oFsI.woff2'             -o 'assets/font/MaterialSymbols/MaterialSymbolsOutlined.woff2'

          cat > assets/font/README.md <<'EOF'
# Local font assets

The CMOTD site uses local copies of Inter, Newsreader, and Material Symbols Outlined.

- Inter: variable Roman and Italic fonts
- Newsreader: variable Roman and Italic fonts
- Material Symbols Outlined: WOFF2 icon font

Inter and Newsreader are distributed under the SIL Open Font License.
EOF

      - name: Validate fonts
        shell: bash
        run: |
          set -euo pipefail
          test -s 'assets/font/Inter/Inter-VariableFont_opsz,wght.ttf'
          test -s 'assets/font/Inter/Inter-Italic-VariableFont_opsz,wght.ttf'
          test -s 'assets/font/Newsreader/Newsreader-VariableFont_opsz,wght.ttf'
          test -s 'assets/font/Newsreader/Newsreader-Italic-VariableFont_opsz,wght.ttf'
          test -s 'assets/font/MaterialSymbols/MaterialSymbolsOutlined.woff2'

      - name: Remove temporary workflow and commit fonts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-cmotd-fonts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore CMOTD local font assets"
          git push
