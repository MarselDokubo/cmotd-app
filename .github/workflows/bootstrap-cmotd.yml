name: Bootstrap CMOTD project

on:
  push:
    paths:
      - ".github/workflows/bootstrap-cmotd.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part*.b64 | base64 --decode > /tmp/cmotd.tar.gz
          gzip -t /tmp/cmotd.tar.gz
          tar -xzf /tmp/cmotd.tar.gz -C .

      - name: Restore local fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/font/Inter assets/font/Newsreader assets/font/MaterialSymbols

          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf' \
            -o 'assets/font/Inter/Inter-VariableFont_opsz,wght.ttf'
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter-Italic%5Bopsz%2Cwght%5D.ttf' \
            -o 'assets/font/Inter/Inter-Italic-VariableFont_opsz,wght.ttf'
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader%5Bopsz%2Cwght%5D.ttf' \
            -o 'assets/font/Newsreader/Newsreader-VariableFont_opsz,wght.ttf'
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/newsreader/Newsreader-Italic%5Bopsz%2Cwght%5D.ttf' \
            -o 'assets/font/Newsreader/Newsreader-Italic-VariableFont_opsz,wght.ttf'

          css="$(curl -fsSL -A 'Mozilla/5.0' 'https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200')"
          url="$(printf '%s' "$css" | grep -o 'https://fonts.gstatic.com[^)]*\.woff2' | head -1)"
          test -n "$url"
          curl -fsSL "$url" -o assets/font/MaterialSymbols/MaterialSymbolsOutlined.woff2

      - name: Validate imported project
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f package.json
          test -f assets/css/cmotd-global.css
          test -f assets/js/cmotd-components.js
          test -f assets/img/staff/director.webp
          test -f pages/cmotd_course_big_data_analytics.html
          test -f pages/cmotd_course_automation_instrumentation_control.html
          test -f assets/font/Inter/Inter-VariableFont_opsz,wght.ttf
          test -f assets/font/Newsreader/Newsreader-VariableFont_opsz,wght.ttf
          test -f assets/font/MaterialSymbols/MaterialSymbolsOutlined.woff2

      - name: Remove transfer bootstrap
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-cmotd.yml

      - name: Commit imported website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import updated CMOTD website project"
          git push
